version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: theatre_db
    environment:
      POSTGRES_DB: theatre_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: theatre_backend
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/theatre_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: theatre_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
